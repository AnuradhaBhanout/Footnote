[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


[project]
name = "ragchatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
   "fastmcp>=2.0.0",
   "arxiv>=2.1.0",
   "fastembed>=0.5.0",
   "rank-bm25>=0.2.2",
   "openai>=1.30.0",
   "python-dotenv>=1.0.0",
   "numpy>=1.26.0",
   "fastapi>=0.115.0",
   "uvicorn>=0.30.0",
   "httpx>=0.28.0",
   "langchain-openai>=0.3.0",
   "langchain>=0.3.0",
   "langgraph>=0.5.0",
   "psycopg2-binary>=2.9.9",
   "psycopg[binary]>=3.1.0",
   "pgvector>=0.3.0",
   "langgraph-checkpoint-postgres>=3.0.0",
   "langchain-mcp-adapters>=0.1.0",
   "mcp>=1.0.0",
   "nest-asyncio>=1.6.0",
   "psycopg-pool>=3.3.1",
   "langfuse>=4.14.0",
