name: CI
"on": [push]
jobs:
 test:
   runs-on: ubuntu-latest
   steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
       python-version: "3.12"
    - run: pip install -r src/requirements.txt
    - run: pip install -e . --no-deps
    - run: pip install pytest>=8.0 pytest-asyncio>=0.24
    - run: pytest -q
      working-directory: src
 install-from-pyproject:
   runs-on: ubuntu-latest
   steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
       python-version: "3.12"
    - run: pip install -e .
    - run: python -c "import api.api, graph.nodes, server.mcp_app"
      working-directory: src 
 smoke:
   runs-on: ubuntu-latest
   services:
    postgres:
      image: pgvector/pgvector:pg16
      env:
        POSTGRES_PASSWORD: postgres
      ports: ["5432:5432"]
      options: >-
        --health-cmd pg_isready --health-interval 5s --health-retries 10
   steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
       python-version: "3.12"
    - run: pip install -r src/requirements.txt
    - run: pip install -e . --no-deps
    - run: |
       uvicorn api.api:app --port 8000 &
       for i in $(seq 30); do curl -fsS http://localhost:8000/health && exit 0; sleep 2; done
       exit 1
      working-directory: src
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        OPENAI_API_KEY: sk-dummy-not-a-real-key
 deploy:
    needs: [test, install-from-pyproject,smoke]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
